name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3)"
        required: true
      update_tap:
        description: "Bump the worktrees-ui cask in ryan953/homebrew-tap"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Settle on both spellings of the version once, so the tag, the Info.plist
      # and the tap bump can never disagree about the leading "v".
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHORT="${INPUT_VERSION#v}"
          else
            SHORT="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$SHORT" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like 0.1.0 or v0.1.0, got '$SHORT'" >&2
            exit 1
          fi
          echo "version=$SHORT" >> "$GITHUB_OUTPUT"
          echo "tag=v$SHORT" >> "$GITHUB_OUTPUT"
          echo "Building $SHORT"

      - name: Test
        run: swift test

      # Universal so the download runs on both Apple silicon and Intel.
      - name: Build the app bundle
        run: Scripts/bundle.sh --version "${{ steps.version.outputs.version }}" --universal

      - name: Check the binary is universal
        run: lipo -info "dist/Worktrees.app/Contents/MacOS/Worktrees"

      # One asset, and it carries the version in its name. That is load-bearing:
      # the tap's scripts/pick_release_asset.py picks the single asset whose name
      # contains the version, and a second one fails the bump below.
      - name: Zip the app
        run: |
          set -euo pipefail
          cd dist
          # ditto keeps the bundle's resource forks and symlinks; `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent "Worktrees.app" \
            "Worktrees-${{ steps.version.outputs.version }}-macos-universal.zip"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Every git worktree on this machine in one window: which ones hold commits
          that exist only on this disk, which ones are already on GitHub, and where
          the working copy for each repository lives.

          ## Install with Homebrew

          ```sh
          export HOMEBREW_GITHUB_API_TOKEN=<a token that can read this repo>
          brew install --cask --no-quarantine ryan953/tap/worktrees-ui
          ```

          The token is needed because this repository is private, and
          `--no-quarantine` because the app is ad-hoc signed but not notarized.

          ## Install by hand

          1. Download the zip, unzip it, and drag **Worktrees.app** to `/Applications`.
          2. The build is not signed with an Apple Developer certificate, so the first
             launch needs **right-click → Open** (once), or:

             ```
             xattr -dr com.apple.quarantine "/Applications/Worktrees.app"
             ```

          ## Requirements

          - macOS 14 or later. The build is universal, so it runs natively on both
            Apple silicon and Intel.
          - `git` on your `PATH`.
          - `gh`, logged in, is optional: without it everything works except the
            pull request links.
          NOTES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ASSET="dist/Worktrees-${VERSION}-macos-universal.zip"
          # Re-running the workflow for an existing tag should refresh the asset
          # rather than fail outright.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "Worktrees ${VERSION}" \
              --notes-file notes.md
          fi

      # github.token is scoped to this repository, so pushing to the tap needs a
      # PAT in the TAP_TOKEN secret, with Contents: Read+Write on
      # ryan953/homebrew-tap and Contents: Read here — the tap's bump script
      # downloads this release's asset to checksum it. A classic token with
      # `repo` covers both. With no token the release still stands; only the cask
      # is left behind, and the summary says how to bump it by hand.
      - name: Bump the Homebrew cask
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.update_tap }}
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::TAP_TOKEN is not set — leaving ryan953/homebrew-tap alone."
            {
              echo "### Homebrew tap not updated"
              echo
              echo "\`TAP_TOKEN\` is not set. Bump the cask by hand:"
              echo
              echo '```sh'
              echo "scripts/bump-cask.sh worktrees-ui ${VERSION}"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/ryan953/homebrew-tap.git" tap
          cd tap
          # The tap owns the bump logic (look up the release, find its asset,
          # rewrite version + asset ID + sha256). Reuse it rather than keeping a
          # second copy of that knowledge here.
          HOMEBREW_GITHUB_API_TOKEN="${TAP_TOKEN}" \
            scripts/bump-cask.sh worktrees-ui "${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "worktrees-ui ${VERSION}"
          git push
          echo "Bumped ryan953/tap/worktrees-ui to ${VERSION}" >> "$GITHUB_STEP_SUMMARY"
