name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.2.3)"
        required: true

permissions:
  contents: write

# The Homebrew cask is not updated from here. ryan953/homebrew-tap reads the
# published releases of every entry it carries and bumps itself, so a release
# needs no write access to another repository and no token to hold it.
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # Settle on both spellings of the version once, so the tag, the Info.plist
      # and the tap bump can never disagree about the leading "v".
      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SHORT="${INPUT_VERSION#v}"
          else
            SHORT="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$SHORT" =~ ^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like 0.1.0 or v0.1.0, got '$SHORT'" >&2
            exit 1
          fi
          echo "version=$SHORT" >> "$GITHUB_OUTPUT"
          echo "tag=v$SHORT" >> "$GITHUB_OUTPUT"
          echo "Building $SHORT"

      - name: Test
        run: swift test

      # Universal so the download runs on both Apple silicon and Intel.
      - name: Build the app bundle
        run: Scripts/bundle.sh --version "${{ steps.version.outputs.version }}" --universal

      - name: Check the binary is universal
        run: lipo -info "dist/Worktrees.app/Contents/MacOS/Worktrees"

      - name: Zip the app
        run: |
          set -euo pipefail
          cd dist
          # ditto keeps the bundle's resource forks and symlinks; `zip` does not.
          ditto -c -k --sequesterRsrc --keepParent "Worktrees.app" \
            "Worktrees-${{ steps.version.outputs.version }}-macos-universal.zip"

      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<'NOTES'
          Every git worktree on this machine in one window: which ones hold commits
          that exist only on this disk, which ones are already on GitHub, and where
          the working copy for each repository lives.

          ## Install

          ```sh
          brew install --cask ryan953/tap/worktrees-ui
          ```

          Or download the zip below, unzip it, and drag **Worktrees.app** to
          `/Applications`.

          The build is ad-hoc signed rather than notarized, so the first launch
          needs **right-click → Open** (once), or:

          ```sh
          xattr -dr com.apple.quarantine "/Applications/Worktrees.app"
          ```

          ## Requirements

          - macOS 14 or later. The build is universal, so it runs natively on both
            Apple silicon and Intel.
          - `git` on your `PATH`.
          - `gh`, logged in, is optional: without it everything works except the
            pull request links.
          NOTES

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          ASSET="dist/Worktrees-${VERSION}-macos-universal.zip"
          # Re-running the workflow for an existing tag should refresh the asset
          # rather than fail outright.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --target "$GITHUB_SHA" \
              --title "Worktrees ${VERSION}" \
              --notes-file notes.md
          fi
